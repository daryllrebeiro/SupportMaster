version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supportmaster-web
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - SUPPORTMASTER_AUTH_MODE=REQUIRED
      - SUPPORTMASTER_API_KEYS=secret|operator|demo-acme|RUN_EXECUTE,AUDIT_READ
      - SUPPORTMASTER_AUTO_APPROVE=true
      - SUPPORTMASTER_RUN_DB=/app/data/runs.db
    volumes:
      - data_volume:/app/data
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supportmaster-worker
    command: python -m supportmaster.runtime.durable_worker
    environment:
      - SUPPORTMASTER_RUN_DB=/app/data/runs.db
    volumes:
      - data_volume:/app/data
    restart: always

volumes:
  data_volume:
